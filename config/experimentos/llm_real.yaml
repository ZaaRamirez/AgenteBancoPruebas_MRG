#  LLM real (Ollama); percepcion y ejecucion simuladas. Evalua solo el razonamiento.
#  agente comparar -x llm_real -e medicamentos_seis_tipos -r 5 --llm qwen3.8,deepseek-r1,gemma4
nombre: llm_real
modo: modular                 # modular | extremo_a_extremo

modelos:                      # nombres de config/modelos.yaml
  llm: qwen3.8
  vlm: simulado
  vla: simulado

entorno:
  tipo: simulado              # simulado | ros2
  robot: omx                  # config/robots/omx.yaml
  tiempo_real: false          # true: respeta la frecuencia del robot
  # imagen: /ruta/a/un/cuadro.png   # imagen fija para probar un VLM real sin camara

razonamiento:
  salida_estructurada: json   # none | json | schema
  max_reintentos_formato: 2   # reconsultas si la salida no es valida

percepcion:
  salida_estructurada: json
  verificar_subtareas: true
  # camaras: [front]          # vacio = todas

ejecucion:
  umbral_estable: 3.0         # unidades de la accion (grados)
  ciclos_estables: 20
  min_pasos: 10
  max_duracion_s: 90          # por subtarea
  max_duracion_extremo_s: 300 # tarea completa en modo extremo a extremo
  registrar_cada: 0           # >0: guarda estado/accion cada N pasos

agente:
  max_reintentos: 3           # por subtarea (articulo: hasta tres)
  max_llamadas_llm: 60

registro:
  guardar_imagenes: false     # true: guarda lo que vio el VLM en cada consulta
